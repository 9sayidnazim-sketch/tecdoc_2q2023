services:
  db:
    image: postgres:16-alpine
    container_name: octaspards-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: octaspards
      POSTGRES_PASSWORD: octaspards
      POSTGRES_DB: octaspards
    ports:
      - "5433:5432"
    volumes:
      - octaspards-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octaspards"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  octaspards-pgdata:
